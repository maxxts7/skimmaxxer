# Skimmaxxer is a static site with nothing to build: the pipeline runs locally
# and commits its output as JS bundles.
#
# The app lives in viewer/, but reads register.js and papers/ from the repo
# root, so the whole repo is published and / sends the reader to the library.

[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/"
  to = "/viewer/"
  status = 302
  force = true
