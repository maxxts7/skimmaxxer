# Skimmaxxer is a static site: the pipeline runs locally and commits its output
# as JS bundles, so there is nothing to build. The only server-side code is the
# pair of functions that take and read paper requests.
#
# The app lives in viewer/, but reads register.js and papers/ from the repo
# root, so the whole repo is published and / sends the reader to the library.

[build]
  publish = "."
  command = "npm install"

# @netlify/blobs 11 needs node >= 22.12
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/"
  to = "/viewer/"
  status = 302
  force = true
