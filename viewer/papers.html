<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skimmaxxer — the library</title>
<meta name="description" content="Research papers taken apart into concepts, self-sufficient figures and a story that reopens at higher resolution.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="landing.css">
<script src="theme.js"></script>
</head>
<body class="library">

<header class="rail">
  <a class="rail-mark" href="index.html">Skimmaxxer</a>
  <button id="theme-toggle" type="button"></button>
</header>

<main class="home" id="home"></main>

<script src="../register.js"></script>
<script>
  // One data bundle per registered paper, injected so the page also opens over file://.
  (function () {
    var reg = (window.SKIM_REGISTER && window.SKIM_REGISTER.papers) || {};
    Object.keys(reg).forEach(function (id) {
      document.write('<script src="../papers/' + id + '/data/js/bundle.js"><\/script>');
    });
  })();
</script>
<script src="home.js"></script>
</body>
</html>
