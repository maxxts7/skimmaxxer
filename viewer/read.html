<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skimmaxxer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body class="reading">

<!-- The same head as the landing page and the shelf. While a paper is open as
     printed, app.js puts the reader's controls in the slot between the mark
     and the toggle. -->
<header class="rail">
  <button id="menu-btn" type="button">Contents</button>
  <a class="rail-mark" href="index.html">Skimmaxxer</a>
  <div class="rail-tools" id="rail-tools"></div>
  <button id="theme-toggle" type="button"></button>
</header>

<div id="app">
  <nav id="sidebar" aria-label="Site"></nav>
  <main id="main"><div class="content" id="content"></div></main>
</div>
<div id="popover" role="tooltip"></div>

<script src="../register.js"></script>
<script>
  // Which paper this shell is about: read.html?p=<paperId>. Every shell loads
  // every bundle, so a link into another paper renders here rather than sending
  // the reader to a different document.
  (function () {
    var reg = (window.SKIM_REGISTER && window.SKIM_REGISTER.papers) || {};
    var m = /[?&]p=([^&#]+)/.exec(location.search);
    var id = m ? decodeURIComponent(m[1]) : "";
    if (!reg[id]) {
      id = Object.keys(reg).filter(function (x) { return reg[x].status === "full"; })[0] ||
           Object.keys(reg)[0] || "";
    }
    window.SKIM_MAIN = id;
    if (reg[id] && reg[id].title) document.title = reg[id].title + " — Skimmaxxer";
    Object.keys(reg).forEach(function (pid) {
      document.write('<script src="../papers/' + pid + '/data/js/bundle.js"><\/script>');
    });
  })();
</script>
<script src="app.js"></script>
</body>
</html>
